name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/e2e.py
      - run: docker build -t roundhouse:test .
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo fmt --manifest-path crates/roundhouse-core/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path crates/roundhouse-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path crates/roundhouse-core/Cargo.toml
      - run: bun install --cwd npm --frozen-lockfile
      - run: bun run --cwd npm build
      - run: bun run --cwd npm typecheck
      - name: Prepare isolated Linux execution fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap openssh-server
          sudo mkdir -p /run/sshd
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s executor -v
      - run: bun run --cwd npm test
      - run: bun install --cwd examples/reportroom --frozen-lockfile
      - run: bun run --cwd examples/reportroom test
      - run: bun install --cwd platform --frozen-lockfile
      - run: bun run --cwd platform build
      - run: bun run --cwd platform test
      - run: bun pm --cwd npm pack
      - run: bun run --cwd npm test:package
      - run: python3 tools/audit_release.py
