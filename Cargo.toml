[package]
name = "roundhouse"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "MPL-2.0"
description = "Always-on, permission-gated agentic operations built on Rotary"

[dependencies]
rx4 = { git = "https://github.com/tschk/rotary", rev = "038592ca3ab5d30a1e230306257c6b885c4d0d17", default-features = false, features = ["providers"] }
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
