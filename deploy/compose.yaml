services:
  roundhouse:
    build:
      context: ..
    restart: unless-stopped
    init: true
    env_file: /etc/roundhouse/secrets.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /etc/roundhouse/config.json:/etc/roundhouse/config.json:ro
      - roundhouse-data:/var/lib/roundhouse
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 10s

volumes:
  roundhouse-data:
